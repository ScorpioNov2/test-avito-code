name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Lấy đường dẫn gốc của site (ví dụ /avito-code-runtime) để Vite build đúng `base`.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      # Toolchain WebAssembly (~225 MB) không nằm trong git: tải về lúc build, có kiểm tra SHA-256.
      - name: Cache WebAssembly toolchains
        uses: actions/cache@v4
        with:
          path: public/wasm
          # Cả script và patch cũng nằm trong khoá cache: đổi chúng thì phải tải lại và áp patch lại.
          key: wasm-${{ hashFiles('scripts/wasm-assets.manifest.json', 'scripts/fetch-wasm-assets.mjs', 'scripts/patches/*.mjs') }}

      - run: npm run fetch-wasm

      - name: Build
        run: npm run build -- --base=${{ steps.pages.outputs.base_path }}/
        env:
          # Đặt trong Settings > Secrets and variables > Actions > Variables
          VITE_SIGNALING_URLS: ${{ vars.VITE_SIGNALING_URLS }}
          # Tuỳ chọn (xem README mục "TURN"): để trống thì app tự lấy TURN từ Worker signaling.
          VITE_TURN_CREDENTIALS_URL: ${{ vars.VITE_TURN_CREDENTIALS_URL }}
          VITE_ICE_SERVERS: ${{ vars.VITE_ICE_SERVERS }}
          VITE_ICE_TRANSPORT_POLICY: ${{ vars.VITE_ICE_TRANSPORT_POLICY }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
