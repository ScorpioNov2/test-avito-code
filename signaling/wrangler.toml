name = "avito-code-signaling"
main = "src/index.ts"
compatibility_date = "2026-01-01"

[[durable_objects.bindings]]
name = "SIGNALING_HUB"
class_name = "SignalingHub"

# Gói miễn phí của Cloudflare chỉ hỗ trợ Durable Object dùng SQLite (new_sqlite_classes).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalingHub"]

[vars]
# Danh sách origin được phép kết nối, ngăn cách bằng dấu phẩy (để trống = cho phép tất cả).
# Ví dụ: "https://<tên-github>.github.io,http://localhost:5173"
ALLOWED_ORIGINS = ""

# --- TURN: cần cho điện thoại dùng dữ liệu di động hoặc mạng chặt (xem README mục "TURN").
# Điền "Turn Token ID" lấy từ Cloudflare Dashboard (Realtime > TURN Server). Đây KHÔNG phải bí mật.
# API token thì LÀ bí mật: đặt bằng `npx wrangler secret put TURN_API_TOKEN`, đừng ghi vào file này.
# Để trống thì /turn-credentials trả 501 và app chỉ dùng STUN.
TURN_KEY_ID = ""
